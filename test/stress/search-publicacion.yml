    flow:
      - post:
          url: "/inputs/search"
          json:
            texto: "{{ $randomPickInArray(['matematica', 'fisica', 'quimica', 'programacion', 'java', 'algoritmos', 'calculo', 'algebra', 'estadistica', 'sistemas', 'electrica', 'mecanica', 'ingenieria', 'proyecto', 'examen', 'parcial', 'teoria', 'practica', 'ejercicio', 'formula']) }}"