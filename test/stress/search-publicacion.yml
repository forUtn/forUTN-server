  phases:
    # Escalamiento gradual para encontrar límite de búsquedas
    - duration: 60
      arrivalRate: 5    # 5 búsquedas/seg
    - duration: 60
      arrivalRate: 10   # 10 búsquedas/seg
    - duration: 60
      arrivalRate: 15   # 15 búsquedas/seg
    - duration: 60
      arrivalRate: 25   # 25 búsquedas/seg
